[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ammber"
version = "0.2.0"
description = "A Python package for parametrizing Gibbs free energy curves for phase-field modeling"
authors = [
    { name = "Xander Mensah", email = "xmen@umich.edu" },
    { name = "W. Beck Andrews", email = "wband@umich.edu" },
    { name = "Lingxia Shi", email = "lingxias@umich.edu" },
    { name = "Katsuyo Thornton", email = "kthorn@umich.edu" }
]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"

requires-python = ">=3.11"

dependencies = [
    "numpy>=2",
    "pycalphad",
    "scipy",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = [
    "pytest",
    "flake8",
]

[tool.setuptools.packages.find]
include = ["ammber"]

[project.urls]
Homepage = "https://github.com/UMThorntonGroup/AMMBER_python"
Repository = "https://github.com/UMThorntonGroup/AMMBER_python"
Documentation = "https://github.com/UMThorntonGroup/AMMBER_python/tree/main/docs"
Issues = "https://github.com/UMThorntonGroup/AMMBER_python/issues"

[tool.pytest.ini_options]
testpaths = ["test"]
